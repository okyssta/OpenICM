name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openicm
          POSTGRES_PASSWORD: openicm
          POSTGRES_DB: openicm
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci

      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://openicm:openicm@localhost:5432/openicm?schema=public

      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://openicm:openicm@localhost:5432/openicm?schema=public

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
        env:
          DATABASE_URL: postgresql://openicm:openicm@localhost:5432/openicm?schema=public
