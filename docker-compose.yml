services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openicm
      POSTGRES_PASSWORD: openicm
      POSTGRES_DB: openicm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openicm -d openicm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://openicm:openicm@db:5432/openicm?schema=public
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
