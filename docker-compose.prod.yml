services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://openicm:openicm@db:5432/openicm?schema=public
      NODE_ENV: production
      APP_PASSWORD: ${APP_PASSWORD:-}
      AUTH_SECRET: ${AUTH_SECRET:-change-me}
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: openicm
      POSTGRES_PASSWORD: openicm
      POSTGRES_DB: openicm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openicm"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app

volumes:
  pgdata:
